[project]
name = "agent"
version = "0.0.1"
description = "Starter template for making a new agent LangGraph."
authors = [
    { name = "William Fu-Hinthorn", email = "13333726+hinthornw@users.noreply.github.com" },
]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "langchain>=1.0.5",
    "langchain_openai>=1.0.2",
    "langchain-community>=0.4.1",
    "langgraph>=1.0.0",
    "langgraph-checkpoint>=3.0.1",
    "langgraph-checkpoint-postgres>=3.0.2",
    # psycopg 3 的纯 Python 实现依赖系统 libpq，Windows 上没有会报
    # "no pq wrapper available"；[binary] 变体自带 libpq，必须这样装。
    "psycopg[binary]>=3.2.0",
    "langgraph-cli>=0.4.11",
    "python-dotenv>=1.0.1",
    "PyMySQL>=1.1.2",
    "numpy>=2.3.4",
    "pycryptodome>=3.23.0",
    # Windows 上 structlog 的彩色日志渲染器需要 colorama，
    # 否则 `langgraph dev` 启动时会抛 SystemError（langgraph-api 未声明该依赖）。
    "colorama>=0.4.6; sys_platform == 'win32'",
]


[project.optional-dependencies]
dev = ["mypy>=1.11.1", "ruff>=0.6.1"]

[build-system]
requires = ["setuptools>=83.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["langgraph.templates.agent", "agent"]
[tool.setuptools.package-dir]
"langgraph.templates.agent" = "src/agent"
"agent" = "src/agent"


[tool.setuptools.package-data]
"*" = ["py.typed"]

[tool.ruff]
lint.select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "D",    # pydocstyle
    "D401", # First line should be in imperative mood
    "T201",
    "UP",
]
lint.ignore = [
    "UP006",
    "UP007",
    # We actually do want to import from typing_extensions
    "UP035",
    # Relax the convention by _not_ requiring documentation for every function parameter.
    "D417",
    "E501",
]
[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "UP"]
[tool.ruff.lint.pydocstyle]
convention = "google"

[dependency-groups]
dev = [
    "anyio>=4.14.2",
    "langgraph-cli[inmem]>=0.4.14",
    "mypy>=1.13.0",
    "pytest>=9.0.3",
    "ruff>=0.8.2",
]
